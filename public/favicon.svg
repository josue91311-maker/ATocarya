<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.7" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022c22" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Modern Stylized "A" + Music Waveform Monogram -->
  <g filter="url(#subtleShadow)">
    <!-- Main Architectural "A" Apex -->
    <path 
      d="M17 48 L30.2 14.6 C31.0 12.6 33.0 12.6 33.8 14.6 L47 48" 
      stroke="#ffffff" 
      stroke-width="5.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    
    <!-- Dynamic Musical Sound Wave Crossbar -->
    <path 
      d="M14 34 C19 34 21 28 26 28 C31 28 33 40 38 40 C43 40 45 34 50 34" 
      stroke="#ffffff" 
      stroke-width="4" 
      stroke-linecap="round" 
    />

    <!-- Musical Note Core Indicator -->
    <circle cx="38" cy="40" r="3.5" fill="#34d399" />
    <circle cx="26" cy="28" r="2.5" fill="#ffffff" />
  </g>
</svg>
