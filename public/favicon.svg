<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0B132B" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Clean Background White Squircle with subtle border -->
  <rect width="64" height="64" rx="16" fill="#FFFFFF" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#1E74FD" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Official ATocarYa Emblem -->
  <g filter="url(#subtleShadow)">
    <!-- Electric Blue circular ring with open gaps -->
    <circle 
      cx="32" 
      cy="32" 
      r="23" 
      stroke="#1E74FD" 
      stroke-width="6.5" 
      stroke-linecap="round"
      stroke-dasharray="115 35"
      stroke-dashoffset="-12"
    />

    <!-- Orange Accent Tip at top-right gap -->
    <polygon 
      points="47,15 52,20 48,24 43,19" 
      fill="#FF7E22" 
    />

    <!-- Deep Navy Music Notehead -->
    <circle 
      cx="24" 
      cy="42" 
      r="9.5" 
      fill="#0B132B" 
    />

    <!-- Electric Blue Checkmark -->
    <path 
      d="M24 42 V26 L34 36 L55 15" 
      stroke="#1E74FD" 
      stroke-width="6.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Deep Navy Note Stem connection -->
    <line 
      x1="24" 
      y1="42" 
      x2="24" 
      y2="26" 
      stroke="#0B132B" 
      stroke-width="6.5" 
      stroke-linecap="round" 
    />
  </g>
</svg>
