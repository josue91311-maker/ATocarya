<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor">
  <!-- Minimalist Editorial Electric Guitar Line Art -->
  <g opacity="0.9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Concentric sun / sound circle arc in background -->
    <circle cx="250" cy="90" r="65" stroke-dasharray="3 3" opacity="0.4" />
    <circle cx="250" cy="90" r="45" opacity="0.6" />
    
    <!-- Guitar Body -->
    <path d="M190 145 C175 165, 140 175, 120 160 C95 140, 100 105, 115 95 C105 85, 105 60, 130 50 C155 40, 185 65, 175 90 C195 105, 205 125, 190 145 Z" />
    <path d="M135 105 C145 100, 160 105, 155 120 C150 135, 130 135, 125 120 Z" />
    
    <!-- Pickguard contour -->
    <path d="M140 70 C160 80, 170 105, 165 125" stroke-dasharray="2 3" opacity="0.7" />
    
    <!-- Neck and Fretboard extending upwards to right -->
    <path d="M170 65 L260 -15" stroke-width="3" />
    <path d="M176 71 L266 -9" stroke-width="3" />
    
    <!-- Frets -->
    <line x1="185" y1="52" x2="191" y2="58" />
    <line x1="200" y1="38" x2="206" y2="44" />
    <line x1="215" y1="24" x2="221" y2="30" />
    <line x1="230" y1="10" x2="236" y2="16" />
    <line x1="245" y1="-4" x2="251" y2="2" />
    
    <!-- Headstock & Tuning pegs -->
    <path d="M260 -15 L285 -35 L292 -28 L266 -9 Z" />
    <circle cx="268" cy="-26" r="2" fill="currentColor" />
    <circle cx="276" cy="-18" r="2" fill="currentColor" />
    <circle cx="284" cy="-10" r="2" fill="currentColor" />

    <!-- Strings -->
    <line x1="145" y1="112" x2="270" y2="-20" stroke-width="0.8" opacity="0.5" />
    <line x1="148" y1="115" x2="273" y2="-17" stroke-width="0.8" opacity="0.5" />
    <line x1="151" y1="118" x2="276" y2="-14" stroke-width="0.8" opacity="0.5" />

    <!-- Volume knobs & Jack -->
    <circle cx="140" cy="145" r="4" />
    <circle cx="155" cy="150" r="4" />
    <line x1="180" y1="135" x2="195" y2="150" />
  </g>
</svg>
