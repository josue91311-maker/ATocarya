<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor">
  <!-- Minimalist Drum Kit Line Art -->
  <g opacity="0.9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cymbals -->
    <!-- Hi-hat / Crash Left -->
    <ellipse cx="80" cy="55" rx="35" ry="8" />
    <line x1="80" y1="55" x2="80" y2="160" />
    <line x1="80" y1="160" x2="65" y2="185" />
    <line x1="80" y1="160" x2="95" y2="185" />

    <!-- Ride / Crash Right -->
    <ellipse cx="240" cy="50" rx="38" ry="9" />
    <line x1="240" y1="50" x2="240" y2="160" />
    <line x1="240" y1="160" x2="225" y2="185" />
    <line x1="240" y1="160" x2="255" y2="185" />

    <!-- Bass Drum (Center) -->
    <ellipse cx="160" cy="120" rx="42" ry="42" />
    <ellipse cx="160" cy="120" rx="36" ry="36" stroke-dasharray="2 3" opacity="0.6" />
    <line x1="120" y1="150" x2="110" y2="175" />
    <line x1="200" y1="150" x2="210" y2="175" />

    <!-- Tom 1 & Tom 2 mounted on bass drum -->
    <ellipse cx="135" cy="72" rx="20" ry="7" />
    <path d="M115 72 V92 C115 96, 155 96, 155 92 V72" />

    <ellipse cx="185" cy="72" rx="20" ry="7" />
    <path d="M165 72 V92 C165 96, 205 96, 205 92 V72" />

    <!-- Snare Drum (Left foreground) -->
    <ellipse cx="105" cy="105" rx="22" ry="8" />
    <path d="M83 105 V122 C83 126, 127 126, 127 122 V105" />

    <!-- Drumsticks crossed -->
    <line x1="100" y1="40" x2="170" y2="90" stroke-width="1.2" />
    <line x1="220" y1="40" x2="150" y2="90" stroke-width="1.2" />
  </g>
</svg>
